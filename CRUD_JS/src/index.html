<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <title>Document</title>
  </head>
  <body>
    <header class="header-container container">
      <div class="header-content">
        <h1>Web Store</h1>
        <nav class="nav-menu">
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <div class="container-btn">
        <button id="btn-cadastro">Cadastrar</button>
      </div>
      <section id="modal" class="modal section-form hide">
        <form class="form">
          <div class="inputs-container">
            <h1>Cadastro de Produtos</h1>
            <span class="close-modal-x" id="close-modal-x">❌</span>
            <div class="inputs-content">
              <div class="inputs">
                <input placeholder="" type="text" id="name" name="name" />
                <label for="name">Name</label>
              </div>
              <div class="inputs">
                <input placeholder="" type="text" id="price" name="price" />
                <label for="price">Price</label>
              </div>
              <div class="inputs">
                <input
                  placeholder=""
                  type="text"
                  id="description"
                  name="description"
                />
                <label for="description">Description</label>
              </div>
            </div>
          </div>
          <div class="button-container">
            <button class="btn primary" id="register-product" type="submit">
              Cadastrar
            </button>
            <button class="btn secondary" id="btn-cancel" type="button">
              Cancelar
            </button>
          </div>
        </form>
      </section>
      <section>
        <div class="all-products" id="all-products"></div>
      </section>
    </main>
    <footer>
      <p>Todos os Direitos Reservados!</p>
    </footer>
    <script type="module" src="./assets/js/app2.js"></script>
  </body>
</html>
